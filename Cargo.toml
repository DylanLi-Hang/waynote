[package]
name = "waynote"
version = "0.1.6"
edition = "2021"
license = "MIT"
description = "A single-window Markdown notes board for Linux"
repository = "https://github.com/mryll/waynote"
homepage = "https://github.com/mryll/waynote"
readme = "README.md"
keywords = ["wayland", "sticky-notes", "markdown", "gtk4"]
categories = ["gui", "command-line-utilities"]

[features]
layer-shell-prototype = ["dep:gtk4-layer-shell"]

[[example]]
name = "layer-shell-prototype"
required-features = ["layer-shell-prototype"]

[dependencies]
gtk = { version = "0.11.3", package = "gtk4", features = ["v4_10"] }
gtk4-layer-shell = { version = "0.8.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "6"
pulldown-cmark = { version = "0.13.4", features = ["default"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
toml = "1.1.2"
ulid = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
